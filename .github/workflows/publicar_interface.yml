# Publica a pasta web/ no GitHub Pages a cada alteração.
# Configurar uma vez: Settings > Pages > Source: GitHub Actions (feito em 28/09/2026).
name: publicar-interface
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/publicar_interface.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
